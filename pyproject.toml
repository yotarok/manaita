[project]
name = "manaita"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudpathlib>=0.24.0",
    "datasets>=4.5.0",
    "gcsfs>=2025.10.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "torch>=2.12.0",
    "torchcodec>=0.14.0",
    "transformers>=5.10.2",
    "tyro>=0.9.35",
]

[project.scripts]
manaita-stage = "manaita.cli.staging:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manaita"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = false
exclude = [ ]

[tool.ruff]
extend-exclude = [ ]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "DTZ",
    "SIM",
    "RET",
    "PERF",
    "NPY",
    "PD",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "manaita",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]
split-on-trailing-comma = true

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring network or external services",
]
